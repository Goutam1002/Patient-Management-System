<div [formGroup]="group">
  <h2 class="h6 text-muted">Vitals</h2>
  <div class="row">
    <div class="col mb-3">
      <label for="temperature" class="form-label">Temperature (°C)</label>
      <input id="temperature" type="number" step="0.1" class="form-control" formControlName="temperature" />
    </div>
    <div class="col mb-3">
      <label for="pulse" class="form-label">Pulse (bpm)</label>
      <input id="pulse" type="number" class="form-control" formControlName="pulse" />
    </div>
  </div>

  <div class="row">
    <div class="col mb-3">
      <label for="bpSystolic" class="form-label">BP Systolic</label>
      <input id="bpSystolic" type="number" class="form-control" formControlName="bpSystolic" />
    </div>
    <div class="col mb-3">
      <label for="bpDiastolic" class="form-label">BP Diastolic</label>
      <input id="bpDiastolic" type="number" class="form-control" formControlName="bpDiastolic" />
    </div>
    <div class="col mb-3">
      <label for="weight" class="form-label">Weight (kg)</label>
      <input id="weight" type="number" step="0.001" class="form-control" formControlName="weight" />
    </div>
  </div>
</div>
